name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Point the build at the preinstalled Android NDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          test -d "$ndk" || { echo "No Android NDK on this runner"; exit 1; }
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Generate the Android project
        run: bun tauri android init --ci

      - name: Add USB host support to the generated project
        run: python3 scripts/patch_android_project.py

      - name: Build the APK
        # x86_64 as well, so the APK also runs on emulators (and the smoke test below).
        run: bun tauri android build --apk --target aarch64 --target x86_64 --ci

      # Reusing one signing key lets a new build install over the previous one.
      - name: Restore the signing key
        uses: actions/cache@v4
        with:
          path: .signing
          key: side-installer-signing-key-v1

      - name: Sign the APK
        run: |
          set -euo pipefail
          unsigned="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)"
          test -n "$unsigned" || { echo "No APK was produced"; exit 1; }
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          mkdir -p .signing
          if [ ! -f .signing/release.jks ]; then
            keytool -genkeypair -keystore .signing/release.jks -storepass android -keypass android \
              -alias sideinstaller -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Side Installer"
          fi
          "$build_tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign --ks .signing/release.jks --ks-pass pass:android \
            --out side-installer.apk "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" verify side-installer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: side-installer-apk
          path: side-installer.apk
          if-no-files-found: error

  # Installs and launches the APK on an emulator. It cannot test the iPhone side.
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: side-installer-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/emulator_smoke_test.sh side-installer.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-test
          path: smoke-test
