name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Point the build at the preinstalled Android NDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          test -d "$ndk" || { echo "No Android NDK on this runner"; exit 1; }
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Generate the Android project
        run: bun tauri android init --ci

      - name: Add USB host support to the generated project
        run: python3 scripts/patch_android_project.py

      - name: Build the APK
        run: bun tauri android build --apk --target aarch64 --ci

      # Reusing one signing key lets a new build install over the previous one.
      - name: Restore the signing key
        uses: actions/cache@v4
        with:
          path: .signing
          key: apk-signing-key-v1

      - name: Sign the APK
        run: |
          set -euo pipefail
          unsigned="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)"
          test -n "$unsigned" || { echo "No APK was produced"; exit 1; }
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          mkdir -p .signing
          if [ ! -f .signing/release.jks ]; then
            keytool -genkeypair -keystore .signing/release.jks -storepass android -keypass android \
              -alias iloader -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=iloader Android (unofficial build)"
          fi
          "$build_tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign --ks .signing/release.jks --ks-pass pass:android \
            --out iloader-android.apk "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" verify iloader-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: iloader-android-apk
          path: iloader-android.apk
          if-no-files-found: error
